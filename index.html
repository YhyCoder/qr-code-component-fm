<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QR code component challenge for the Frontend Mentor site"
    />
    <title>Frontend Mentor | QR code component</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/png/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <article class="card">
          <div class="card__image-wrapper">
            <img
              src="./assets/images/png/image-qr-code.png"
              alt="QR code image linked to the frontend mentor website page"
              class="card__image"
              width="288"
              height="288"
            />
          </div>
          <div class="card__content">
            <h2 class="card__title">
              Improve your front-end skills by building projects
            </h2>
            <p class="card__description">
              Scan the QR code to visit Frontend Mentor and take your coding
              skills to the next level
            </p>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
